<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
html, body {
  margin: 0 !important;
  padding: 0 !important;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  font-family: -apple-system, sans-serif;
  font-size: 13px;
  color: #e0e0e0;
  background: #1e1e1e;
}
#wrap {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
h2 {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  margin: 0;
}
p {
  font-size: 12px;
  color: #888;
  margin: 0;
  line-height: 1.5;
}
#castBtn {
  width: 100%;
  padding: 8px 12px;
  background: #e74c3c;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
#castBtn:hover { background: #c0392b; }
#status {
  font-size: 12px;
  color: #aaa;
  min-height: 16px;
}
#status.error { color: #e07070; }
</style>
</head>
<body>
<div id="wrap">
  <h2>📺 Google Cast</h2>
  <p>Opens the video in Chrome. Use Chrome's Cast button in the toolbar to send it to your device.</p>
  <button id="castBtn">Cast Current Video</button>
  <div id="status"></div>
</div>
<script src="sidebar.js"></script>
</body>
</html>

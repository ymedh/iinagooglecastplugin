<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; font-size: 13px; color: #e0e0e0; background: #1e1e1e; padding: 12px; }
h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #fff; }
#scanBtn { width: 100%; padding: 7px 12px; background: #e74c3c; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
#scanBtn:hover { background: #c0392b; }
#scanBtn:disabled { background: #555; cursor: default; }
#status { margin-top: 10px; color: #aaa; font-size: 12px; min-height: 16px; }
#deviceList { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.device-card { background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 8px; padding: 9px 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.device-name { font-weight: 500; color: #fff; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.device-ip { font-size: 11px; color: #888; white-space: nowrap; }
.cast-btn { background: #e74c3c; color: #fff; border: none; border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.cast-btn:hover { background: #c0392b; }
.cast-btn:disabled { background: #555; cursor: default; }
#error { margin-top: 10px; background: #3a1a1a; border: 1px solid #6b2c2c; border-radius: 6px; padding: 8px 10px; color: #e07070; font-size: 12px; display: none; }
#castResult { margin-top: 8px; font-size: 12px; display: none; padding: 6px 10px; border-radius: 6px; }
#castResult.ok { background: #1a3a1a; color: #70e070; border: 1px solid #2c6b2c; }
#castResult.fail { background: #3a1a1a; color: #e07070; border: 1px solid #6b2c2c; }
</style>
</head>
<body>
<h2>📺 Google Cast</h2>
<button id="scanBtn">Scan for Devices</button>
<div id="status"></div>
<div id="error"></div>
<div id="castResult"></div>
<div id="deviceList"></div>
<script>
var scanBtn = document.getElementById('scanBtn');
var statusEl = document.getElementById('status');
var errorEl = document.getElementById('error');
var castResultEl = document.getElementById('castResult');
var deviceListEl = document.getElementById('deviceList');

scanBtn.addEventListener('click', function() {
  scanBtn.disabled = true;
  deviceListEl.innerHTML = '';
  errorEl.style.display = 'none';
  castResultEl.style.display = 'none';
  statusEl.textContent = 'Scanning...';
  iina.postMessage('execScan', {});
});

iina.onMessage('status', function(data) {
  statusEl.textContent = data.text;
});

iina.onMessage('devices', function(data) {
  scanBtn.disabled = false;
  if (data.error) {
    errorEl.textContent = data.error;
    errorEl.style.display = 'block';
    statusEl.textContent = '';
  }
  if (data.devices && data.devices.length > 0) {
    errorEl.style.display = 'none';
    statusEl.textContent = '';
    deviceListEl.innerHTML = '';
    data.devices.forEach(function(dev) {
      var card = document.createElement('div');
      card.className = 'device-card';

      var nameEl = document.createElement('div');
      nameEl.className = 'device-name';
      nameEl.textContent = dev.name;

      var ipEl = document.createElement('div');
      ipEl.className = 'device-ip';
      ipEl.textContent = dev.ip;

      var btn = document.createElement('button');
      btn.className = 'cast-btn';
      btn.textContent = 'Cast';
      btn.addEventListener('click', function() {
        btn.disabled = true;
        btn.textContent = '...';
        castResultEl.style.display = 'none';
        iina.postMessage('castTo', { ip: dev.ip, port: dev.port });
      });

      card.appendChild(nameEl);
      card.appendChild(ipEl);
      card.appendChild(btn);
      deviceListEl.appendChild(card);
    });
  }
});

iina.onMessage('castResult', function(data) {
  document.querySelectorAll('.cast-btn').forEach(function(b) {
    b.disabled = false;
    b.textContent = 'Cast';
  });
  castResultEl.className = data.ok ? 'ok' : 'fail';
  castResultEl.textContent = data.ok ? '✓ Casting started!' : '✗ ' + (data.error || 'Cast failed.');
  castResultEl.style.display = 'block';
});
</script>
</body>
</html>
